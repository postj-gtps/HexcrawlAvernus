<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avernus Interactive Hexcrawl Map</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Calibration Panel (Hidden by default; reveal via ?calibrate=true) -->
  <div id="calibration-panel" class="calibration-drawer">
    <h3>Grid Alignment Calibration</h3>
    <div class="control-group">
      <label for="input-radius">Hex Radius (px): <span id="val-radius">31</span></label>
      <input type="range" id="input-radius" min="10" max="100" step="0.5" value="31">
    </div>
    <div class="control-group">
      <label for="input-offset-x">Offset X (px): <span id="val-offset-x">75</span></label>
      <input type="range" id="input-offset-x" min="0" max="200" step="1" value="75">
    </div>
    <div class="control-group">
      <label for="input-offset-y">Offset Y (px): <span id="val-offset-y">79</span></label>
      <input type="range" id="input-offset-y" min="0" max="200" step="1" value="79">
    </div>
    <div class="control-group">
      <label for="input-color">Border Color:</label>
      <input type="color" id="input-color" value="#000000">
    </div>
    <div class="control-group">
      <label><input type="checkbox" id="toggle-borders" checked> Highlight Grid Borders</label>
    </div>
    <button id="btn-export-config">Log Final Config to Console</button>
  </div>

  <!-- App Layout Wrapper -->
  <div class="app-container">
    
    <!-- Left Column: Interactive Map Viewport -->
    <div id="map-container" class="map-viewport">
      <img id="map-image" src="assets/map-image.jpg" alt="Avernus Map">
      <svg id="hex-svg-overlay" class="grid-overlay"></svg>
    </div>

    <!-- Right Column: Permanent Info & Journal Sidebar -->
    <aside id="sidebar" class="sidebar-panel">
      
      <!-- Sidebar Header & GM PIN Lock Bar -->
      <div class="sidebar-header">
        <h2 id="sidebar-title">Campaign Journal</h2>
        <button id="btn-gm-toggle" class="btn-gm-lock">
          <span id="gm-lock-icon">🔒</span> <span id="gm-lock-text">Enter GM Mode</span>
        </button>
      </div>

      <!-- Hex Details Content Area -->
      <div id="sidebar-content" class="sidebar-body">
        <div class="placeholder-notice">
          <p>📍 <strong>Select a hex on the map</strong> to view location lore and record party journal notes.</p>
        </div>
      </div>

    </aside>
  </div>

  <!-- PIN Prompt Overlay Modal -->
  <div id="pin-modal" class="modal hidden">
    <div class="modal-content pin-modal-box">
      <h3>Enter GM PIN</h3>
      <p>Enter the 4-digit security code to unlock GM tools:</p>
      <input type="password" id="pin-input" maxlength="4" placeholder="••••" autocomplete="off">
      <div id="pin-error" class="error-msg hidden">Incorrect PIN. Try again.</div>
      <div class="pin-modal-actions">
        <button id="btn-pin-submit" class="btn-primary">Unlock</button>
        <button id="btn-pin-cancel" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/map.js"></script>
  <script src="js/sheets-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
